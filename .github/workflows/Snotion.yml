name: Snotion CI/CD

# 触发条件：推送到mmm分支或创建PR时
on:
  push:
    branches: ['mmm']
  pull_request:
    branches: ['mmm']

jobs:
  # 代码检查工作流
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 缓存依赖
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 代码检查
        run: npm run lint # 确保package.json已添加lint脚本

  # 构建工作流
  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 缓存依赖
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  # 部署工作流（仅在mmm分支推送时执行）
  deploy:
    if: github.ref == 'refs/heads/mmm' # 修正为mmm分支
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 获取构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
